# DOSBox Staging settings for running SkyRoads (loaded on top of the defaults).
[sdl]
fullscreen = false
# a fixed, unscaled-ish window keeps screen-capture calibration stable
windowresolution = 1280x960

[render]
aspect = on
shader = none

[cpu]
cycles = auto

[autoexec]
mount c "skyroads"
c:
skyroads
