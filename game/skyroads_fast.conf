# DOSBox Staging settings for evolution runs: small, silent windows with exact colours.
[sdl]
fullscreen = false
windowresolution = 640x480

[render]
aspect = on
shader = none

[mixer]
nosound = true

[sdl]
mapperfile = skyroads_fast.map

[cpu]
cycles = auto

[autoexec]
mount c "skyroads"
c:
skyroads
